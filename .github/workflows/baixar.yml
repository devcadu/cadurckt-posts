name: baixar-imagens
on:
  push:
    paths: ['pedidos/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          shopt -s nullglob
          for f in pedidos/*.txt; do
            while IFS='|' read -r destino url; do
              [ -z "$destino" ] && continue
              mkdir -p "$(dirname "$destino")"
              curl -sSL --fail -o "$destino" "$url" && echo "ok $destino" || echo "FALHOU $destino"
            done < "$f"
            git rm -q "$f"
          done
      - name: Commit
        run: |
          git config user.name "robo-imagens"; git config user.email "robo@users.noreply.github.com"
          git add -A; git commit -qm "imagens baixadas" || exit 0
          git pull --rebase -q; git push -q
